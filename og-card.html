<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OG Card</title>
<!--
  Social-share image template (1200×630).
  To create assets/og-image.png: open this file, screenshot the card at exactly 1200×630
  (or use a headless screenshot tool), and save it as assets/og-image.png.
-->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600&family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>
  body { margin: 0; }
  .card { width: 1200px; height: 630px; position: relative; overflow: hidden; background: linear-gradient(160deg, #2f4a37, #223528); color: #f4eddb; font-family: "Inter", sans-serif; display: flex; flex-direction: column; justify-content: space-between; padding: 70px 80px; box-sizing: border-box; }
  .topo { position: absolute; inset: 0; opacity: 0.28; }
  .top { display: flex; align-items: center; gap: 18px; position: relative; }
  .top img { width: 64px; }
  .top .wm b { font-family: "Inter"; font-weight: 800; font-size: 26px; letter-spacing: 1px; display: block; }
  .top .wm span { color: #e0a86c; font-weight: 600; letter-spacing: 6px; font-size: 15px; }
  h1 { font-family: "Fraunces", serif; font-weight: 500; font-size: 76px; line-height: 1.05; margin: 0; position: relative; max-width: 15ch; }
  h1 em { color: #e0a86c; font-style: italic; }
  .foot { display: flex; justify-content: space-between; align-items: center; position: relative; color: rgba(244,237,219,0.8); font-size: 22px; }
  .foot .pill { border: 1px solid rgba(244,237,219,0.3); border-radius: 100px; padding: 10px 22px; font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <svg class="topo" viewBox="0 0 1200 630" preserveAspectRatio="none" fill="none" stroke="rgba(244,237,219,0.4)" stroke-width="1.5">
    <path d="M-20 180 Q300 100 620 180 T1240 170"/><path d="M-20 280 Q360 200 620 280 T1240 270"/><path d="M-20 400 Q300 320 620 400 T1240 390"/><path d="M-20 520 Q360 440 620 520 T1240 510"/>
  </svg>
  <div class="top"><img src="assets/mark.png" alt=""><div class="wm"><b>STONERIDGE</b><span>DIGITAL</span></div></div>
  <h1>Marketing that moves your <em>local market.</em></h1>
  <div class="foot"><span>Websites · SEO · Ads · Social · Automation</span><span class="pill">stoneridgedigital.com</span></div>
</div>
</body>
</html>
